name: Publish

"on":
  workflow_dispatch:

# Publishes every artifact from the runner that can build it. Maven Central
# coordinates are immutable, so each publication is produced by exactly one
# runner:
#
#   macos-14      -> :sdl-kmp metadata + jvm + all Apple target klibs
#                    (macos/ios/tvos, each with the embedded SDL3 static
#                    library built on this runner) + the
#                    sdl-kmp-jni-jvm-darwin-{aarch64,x86_64} artifacts
#   ubuntu-latest -> :sdl-kmp linuxX64 + linuxArm64 + mingwX64 klibs (with
#                    the embedded static library; the latter two are
#                    cross-compiled) +
#                    sdl-kmp-jni-jvm-linux-x86_64 and
#                    sdl-kmp-jni-jvm-linux-aarch64 (cross-compiled)
#   windows-latest -> sdl-kmp-jni-jvm-windows-x86_64 (native MinGW build)
#   ubuntu-latest -> :sdl-kmp linuxX64 + mingwX64 klibs (with the embedded
#                    static library; mingwX64 is cross-compiled)
#   ubuntu-latest -> :sdl-kmp androidNative klibs (arm64/arm32/x64/x86, with
#                    the embedded static library built via the Android NDK)
#   ubuntu-latest -> :sdl-kmp wasmJs klib + :sdl-kmp:wasm assets
#                    (Emscripten-compiled SDL3 module sdl_wasm.js/.wasm +
#                    sdl_kmp_glue.js; the wasmJs target has no cinterop, so
#                    the module cannot ride inside the klib)
#
# The kotlinMultiplatform metadata module (published from macOS) redirects to
# the per-target klib modules, so all of them must be published before
# consumers can resolve the artifact.
#
# Trigger: run manually via the Actions tab. Version is fixed at 1.0.0
# (build.gradle.kts).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   MAVEN_CENTRAL_USERNAME   Sonatype Central Portal user-token username
#   MAVEN_CENTRAL_PASSWORD   Sonatype Central Portal user-token password
#   SIGNING_KEY              base64-encoded PGP secret key ring (.gpg, binary)
#   SIGNING_KEY_ID           8-hex-digit key id (without the 0x prefix)
#   SIGNING_PASSWORD         Passphrase of the signing key

jobs:
  publish-macos:
    name: Publish macOS (metadata + jvm + Apple klibs)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The SDL submodule ships its own wrapper jar (android-project),
          # which is not part of the action's known-good checksum list.
          validate-wrappers: false

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      # Per-target publications are used instead of
      # publishAllPublicationsToMavenCentralRepository so that the linuxX64 /
      # mingwX64 klibs (built with their embedded static library on the Linux
      # runner) are not published from here as bindings-only klibs.
      - name: Publish metadata, jvm, Apple target klibs and the darwin JNI artifacts
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :sdl-kmp:publishKotlinMultiplatformPublicationToMavenCentralRepository
          :sdl-kmp:publishJvmPublicationToMavenCentralRepository
          :jni-jvm-darwin-aarch64:publishMavenPublicationToMavenCentralRepository
          :jni-jvm-darwin-x86_64:publishMavenPublicationToMavenCentralRepository
          :sdl-kmp:publishMacosArm64PublicationToMavenCentralRepository
          :sdl-kmp:publishMacosX64PublicationToMavenCentralRepository
          :sdl-kmp:publishIosArm64PublicationToMavenCentralRepository
          :sdl-kmp:publishIosX64PublicationToMavenCentralRepository
          :sdl-kmp:publishIosSimulatorArm64PublicationToMavenCentralRepository
          :sdl-kmp:publishTvosArm64PublicationToMavenCentralRepository
          :sdl-kmp:publishTvosSimulatorArm64PublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-linux:
    name: Publish Linux (linuxX64/mingwX64 klibs)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxrandr-dev libxrender-dev libxss-dev libxtst-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev libegl-dev libdecor-0-dev \
            libpipewire-0.3-dev libpulse-dev libasound2-dev \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The SDL submodule ships its own wrapper jar (android-project),
          # which is not part of the action's known-good checksum list.
          validate-wrappers: false

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish linuxX64/mingwX64 klibs and the linux JNI artifacts
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :sdl-kmp:publishLinuxX64PublicationToMavenCentralRepository
          :sdl-kmp:publishLinuxArm64PublicationToMavenCentralRepository
          :sdl-kmp:publishMingwX64PublicationToMavenCentralRepository
          :jni-jvm-linux-x86_64:publishMavenPublicationToMavenCentralRepository
          :jni-jvm-linux-aarch64:publishMavenPublicationToMavenCentralRepository
          # The windows-x86_64 JNI artifact is published by the
          # publish-windows job (native MinGW build), not from here.
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-android:
    name: Publish Android (androidNative klibs)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The androidNative klibs embed the SDL3 static library, which is
      # cross-compiled with the Android NDK.
      - name: Install Android NDK
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The SDL submodule ships its own wrapper jar (android-project),
          # which is not part of the action's known-good checksum list.
          validate-wrappers: false

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish androidNative klibs
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :sdl-kmp:publishAndroidNativeArm64PublicationToMavenCentralRepository
          :sdl-kmp:publishAndroidNativeArm32PublicationToMavenCentralRepository
          :sdl-kmp:publishAndroidNativeX64PublicationToMavenCentralRepository
          :sdl-kmp:publishAndroidNativeX86PublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-wasm-assets:
    name: Publish wasmJs klib + wasm assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          "$HOME/emsdk/emsdk" construct_env

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The SDL submodule ships its own wrapper jar (android-project),
          # which is not part of the action's known-good checksum list.
          validate-wrappers: false

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish the wasmJs klib and the wasm assets jar
        run: >
          ./gradlew --no-daemon --stacktrace
          -Pwasm.emsdk="$HOME/emsdk"
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :sdl-kmp:publishWasmJsPublicationToMavenCentralRepository
          :sdl-kmp:wasm:publishMavenPublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  publish-windows:
    name: Publish Windows (windows-x86_64 JNI artifact)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install CMake
        shell: pwsh
        run: |
          choco install cmake -y --no-progress
          # cmake.exe may not be on PATH for the Gradle daemon.
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          # The JVM needs MinGW's runtime DLLs (libwinpthread-1.dll,
          # libgcc_s_seh-1.dll) on PATH to load the JNI DLL.
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The SDL submodule ships its own wrapper jar (android-project),
          # which is not part of the action's known-good checksum list.
          validate-wrappers: false

      - name: Decode signing key
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\signing-key.gpg",
            [Convert]::FromBase64String("${{ secrets.SIGNING_KEY }}")
          )
          Get-Item "$env:RUNNER_TEMP\signing-key.gpg" | Select-Object Length

      - name: Publish the windows-x86_64 JNI artifact
        shell: cmd
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}\signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :jni-jvm-windows-x86_64:publishMavenPublicationToMavenCentralRepository
          --continue
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
