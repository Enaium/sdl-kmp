name: Test

"on":
  workflow_dispatch:

# Builds and tests each platform on the runner that can build it:
#
#   macOS ARM64 -> :sdl-kmp metadata + jvm + all Apple target klibs
#                  (with the embedded SDL3 static library), the
#                  :jni-jvm-darwin-* JNI artifacts, JVM + native tests, and
#                  the example app (native + JVM, headless)
#   Linux x64   -> linuxX64 klib (with embedded static library) and the
#                  cross-compiled mingwX64 klib, JVM + native tests, and
#                  the example app (native, headless)
#   Windows x64 -> the windows-x86_64 JNI artifact (native MinGW build) and
#                  JVM tests
#   Android x64 -> the four androidNative klibs (with the embedded static
#                  library built via the Android NDK) and the example APKs
#                  (assembleDebug)
#   Web x64     -> the wasmJs klib (SDL3 compiled to a standalone Emscripten
#                  module), the :sdl-kmp:wasm assets jar, and the
#                  sdl_renderer browser example (headless, dummy drivers,
#                  via Node)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test macOS ARM64
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The SDL submodule ships its own wrapper jar (android-project),
          # which is not part of the action's known-good checksum list.
          validate-wrappers: false

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish all platforms to Maven Local
        run: >
          ./gradlew --no-daemon --rerun-tasks --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :sdl-kmp:publishToMavenLocal
          :jni-jvm-darwin-aarch64:publishToMavenLocal
          :jni-jvm-darwin-x86_64:publishToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon :sdl-kmp:jvmTest

      - name: Run native tests (macosArm64)
        run: ./gradlew --no-daemon :sdl-kmp:macosArm64Test

      - name: Run example (JVM, headless)
        run: SDL_VIDEO_DRIVER=dummy ./gradlew --no-daemon :examples:sdl_renderer:jvmRun

      - name: Run example (macosArm64, headless)
        run: SDL_VIDEO_DRIVER=dummy ./gradlew --no-daemon :examples:sdl_renderer:runDebugExecutableMacosArm64

  test-linux:
    name: Test Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxrandr-dev libxrender-dev libxss-dev libxtst-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev libegl-dev libdecor-0-dev \
            libpipewire-0.3-dev libpulse-dev libasound2-dev \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The SDL submodule ships its own wrapper jar (android-project),
          # which is not part of the action's known-good checksum list.
          validate-wrappers: false

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish linuxX64/mingwX64 klibs and the linux/windows JNI artifacts to Maven Local
        run: >
          ./gradlew --no-daemon --rerun-tasks --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :sdl-kmp:publishKotlinMultiplatformPublicationToMavenLocal
          :sdl-kmp:publishLinuxX64PublicationToMavenLocal
          :sdl-kmp:publishMingwX64PublicationToMavenLocal
          :jni-jvm-linux-x86_64:publishToMavenLocal
          :jni-jvm-windows-x86_64:publishToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon :sdl-kmp:jvmTest

      - name: Run native tests (linuxX64)
        run: ./gradlew --no-daemon :sdl-kmp:linuxX64Test

      - name: Run example (linuxX64, headless)
        run: SDL_VIDEO_DRIVER=dummy ./gradlew --no-daemon :examples:sdl_renderer:runDebugExecutableLinuxX64

  test-android:
    name: Test Android (androidNative + APK)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Kotlin/Native cross-compiles the androidNative targets from any host,
      # but SDL3's static library needs the Android NDK.
      - name: Install Android NDK
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "platforms;android-36" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The SDL submodule ships its own wrapper jar (android-project),
          # which is not part of the action's known-good checksum list.
          validate-wrappers: false

      - name: Build androidNative klibs
        run: >
          ./gradlew --no-daemon --stacktrace
          :sdl-kmp:compileKotlinAndroidNativeArm64
          :sdl-kmp:compileKotlinAndroidNativeArm32
          :sdl-kmp:compileKotlinAndroidNativeX64
          :sdl-kmp:compileKotlinAndroidNativeX86

      - name: Assemble example Android APKs
        run: >
          ./gradlew --no-daemon --stacktrace
          :examples:sdl_renderer:android:assembleDebug
          :examples:sdl_gpu:android:assembleDebug

  test-web:
    name: Test Web (wasmJs)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          "$HOME/emsdk/emsdk" construct_env

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The SDL submodule ships its own wrapper jar (android-project),
          # which is not part of the action's known-good checksum list.
          validate-wrappers: false

      - name: Build the wasmJs klib
        run: >
          ./gradlew --no-daemon --stacktrace
          -Pwasm.emsdk="$HOME/emsdk"
          :sdl-kmp:compileKotlinWasmJs

      - name: Build the wasm assets jar
        run: >
          ./gradlew --no-daemon --stacktrace
          -Pwasm.emsdk="$HOME/emsdk"
          :sdl-kmp:wasm:jar

      - name: Assemble the browser example
        run: >
          ./gradlew --no-daemon --stacktrace
          -Pwasm.emsdk="$HOME/emsdk"
          :examples:sdl_renderer:browser:copyWebAssets

      - name: Run the browser example headless (Node)
        run: >
          node examples/sdl_renderer/browser/build/browserApp/browser-node-test.mjs

  test-windows:
    name: Test Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install CMake
        shell: pwsh
        run: |
          choco install cmake -y --no-progress
          # cmake.exe may not be on PATH for the Gradle daemon.
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          # The JVM needs MinGW's runtime DLLs (libwinpthread-1.dll,
          # libgcc_s_seh-1.dll) on PATH to load the JNI DLL.
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The SDL submodule ships its own wrapper jar (android-project),
          # which is not part of the action's known-good checksum list.
          validate-wrappers: false

      - name: Decode signing key
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\signing-key.gpg",
            [Convert]::FromBase64String("${{ secrets.SIGNING_KEY }}")
          )
          Get-Item "$env:RUNNER_TEMP\signing-key.gpg" | Select-Object Length

      - name: Publish windows JNI to Maven Local
        shell: cmd
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}\signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :jni-jvm-windows-x86_64:publishToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon --stacktrace :sdl-kmp:jvmTest
